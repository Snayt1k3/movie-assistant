[project]
name = "seans"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["api", "bot", "cron", "common"]

[dependency-groups]
dev = [
    "alembic>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
